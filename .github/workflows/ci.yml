name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Modelled on w3c/smufl's pages.yml: schema first, then the checks a schema cannot express,
# then the generated artefacts are re-derived and compared against what is committed.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tools.validate compares slugs against the previous release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements.txt

      - name: Schema — vocabulary
        run: check-jsonschema --schemafile schema/pivot.schema.json vocabulary/pivot.json

      - name: Schema — device layouts
        run: |
          shopt -s nullglob globstar
          files=(data/devices/**/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            check-jsonschema --schemafile schema/device-layout.schema.json "${files[@]}"
          else
            echo "no device layouts yet"
          fi

      - name: Schema — sources registry
        run: |
          if [ -f data/sources.json ]; then
            check-jsonschema --schemafile schema/sources.schema.json data/sources.json
          fi

      - name: Schema — validator fixture
        run: check-jsonschema --schemafile schema/device-layout.schema.json tools/validate/fixtures/*.json

      - name: Invariants a schema cannot express
        run: python -m tools.validate

      - name: Validator self-test against the fixture
        run: python -m tools.validate --devices tools/validate/fixtures

      - name: Canonical formatting
        run: python -m tools.format --check

      - name: Round-trip the legacy .iom files
        run: python -m tools.iom.roundtrip_check data/legacy-iom

      - name: Generated evidence is up to date
        run: |
          python -m tools.iom.analyze data/legacy-iom > /tmp/loss.md
          diff -u docs/evidence/note-number-pivot-loss.md /tmp/loss.md
